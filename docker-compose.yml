# Local development stack (SRS 14.1).
#   Infrastructure only:   docker compose up -d
#   Plus Phase 1 services: infra/keys/generate-dev-keys.sh, then docker compose --profile app up -d --build
#   Plus tools (Kafka UI): add --profile tools
#   OpenSearch (phase 4):  add --profile search
name: bigbazaar

x-service-env: &service-env
  JWT_ISSUER: bigbazaar-identity
  JWT_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigbazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigbazaar_dev}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["tools"]
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  identity-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_svc
      DB_PASSWORD: identity_svc_dev
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JWT_PRIVATE_KEY_PATH: file:/run/secrets/jwt-private.pem
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?run infra/keys/generate-dev-keys.sh and set MFA_ENCRYPTION_KEY in .env}
      # KYC documents: local disk in development, S3 (or any S3-compatible store) when STORAGE_PROVIDER=s3.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8080}
      STORAGE_SIGNING_KEY: ${STORAGE_SIGNING_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      # Only identity-service gets the private key; everyone else uses the public JWKS.
      - ./infra/keys/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - uploads-data:/data/uploads
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      <<: *service-env
      REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      AUDIT_SERVICE_URL: http://audit-service:8091
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy

  audit-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/platform_db
      DB_USERNAME: platform_svc
      DB_PASSWORD: platform_svc_dev
    ports: ["8091:8091"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy

volumes:
  postgres-data:
  uploads-data:
