server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME:identity_svc}
    password: ${DB_PASSWORD:identity_svc_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  servlet:
    multipart:
      enabled: false
  data:
    web:
      pageable:
        max-page-size: 100

bigbazaar:
  jwt:
    issuer: ${JWT_ISSUER:bigbazaar-identity}
    # PKCS#8 RSA key; only identity-service holds it. Public keys: /.well-known/jwks.json
    private-key-location: ${JWT_PRIVATE_KEY_PATH:file:infra/keys/jwt-private.pem}
    # Retired public keys still trusted after a rotation (comma-separated); see infra/keys/rotate-signing-key.sh
    previous-public-key-locations: ${JWT_PREVIOUS_PUBLIC_KEYS:}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY:}
    issuer-name: BigBazaar
    challenge-ttl: 5m
    max-challenge-attempts: 5
    recovery-code-count: 10
  storage:
    provider: ${STORAGE_PROVIDER:local}
    cleanup-interval: 1h
    local:
      directory: ${STORAGE_LOCAL_DIR:./data/uploads}
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
      signing-key: ${STORAGE_SIGNING_KEY:}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-south-1}
      endpoint: ${S3_ENDPOINT:}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:false}
      create-bucket: ${S3_CREATE_BUCKET:false}
  login:
    max-failed-attempts: 5
    lock-duration: 15m
  outbox:
    poll-interval: 1s
    batch-size: 100
    max-attempts: 10
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      service: ${spring.application.name}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
  include-application-name: false
