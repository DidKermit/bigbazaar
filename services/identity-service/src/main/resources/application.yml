server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME:identity_svc}
    password: ${DB_PASSWORD:identity_svc_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  data:
    web:
      pageable:
        max-page-size: 100

bigbazaar:
  jwt:
    issuer: ${JWT_ISSUER:bigbazaar-identity}
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:14d}
  login:
    max-failed-attempts: 5
    lock-duration: 15m
  outbox:
    poll-interval: 1s
    batch-size: 100
    max-attempts: 10
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      service: ${spring.application.name}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
  include-application-name: false
